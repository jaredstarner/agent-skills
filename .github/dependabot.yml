version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /.github/scripts
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
